[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intervals-icu-mcp"
version = "1.0.0"
description = "MCP server for intervals.icu athlete training data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=0.9.0",
]

[project.scripts]
intervals-icu-mcp = "server:main"
